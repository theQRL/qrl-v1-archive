[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qrl-v1-archive"
version = "0.1.0"
description = "QRL v1 canonical archive export and structural verification tools"
requires-python = ">=3.10"
dependencies = [
  "plyvel>=1.2,<2",
  "protobuf>=4.25,<7",
  "googleapis-common-protos>=1.60,<2",
]

[project.scripts]
qrl-archive = "qrl_archive.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qrl_archive = ["vendor/qrl.proto", "vendor/QRL-LICENSE"]
